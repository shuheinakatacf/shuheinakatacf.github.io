<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>お問い合わせフォーム</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- タイトル帯 -->
<div class="page-header">
  <h1>お問い合わせフォーム</h1>
  <p class="page-description">
    ※本ページは Salesforce Web-to-リード機能のデモ用フォームです。送信された情報はテスト環境に登録されます。
  </p>
</div>

<div class="wrapper">

  <form action="https://test.salesforce.com/servlet/servlet.WebToLead?encoding=UTF-8&orgId=00DH30000008kpW"
        method="POST">

    <input type="hidden" name="oid" value="00DH30000008kpW">
    <input type="hidden" name="retURL" value="http://">

<div class="form-group">
  <label>お名前</label>
  <div class="input-wrapper name-group">
    <input id="last_name" name="last_name" maxlength="80" type="text"
           placeholder="姓">
    <input id="first_name" name="first_name" maxlength="40" type="text"
           placeholder="名">
  </div>
</div>

    <div class="form-group">
      <label>フリガナ</label>
      <input id="00NH300000AJdOn" name="00NH300000AJdOn" maxlength="255" type="text"
             placeholder="お名前を全角カタカナでご記入ください">
    </div>

    <div class="form-group">
      <label>会社名</label>
      <input id="company" name="company" maxlength="40" type="text"
             placeholder="会社名を全角でご記入ください">
    </div>

    <div class="form-group">
      <label>薬局名</label>
      <input id="00NH300000AJdOt" name="00NH300000AJdOt" maxlength="255" type="text"
             placeholder="薬局名をご記入ください">
    </div>

    <div class="form-group">
      <label>役職名</label>
      <input id="title" name="title" maxlength="40" type="text"
             placeholder="役職名をご記入ください">
    </div>

    <div class="form-group">
      <label>都道府県</label>
      <select id="state" name="state">
        <option value="">選択してください</option>
        <option value="北海道">北海道</option>
        <option value="青森県">青森県</option>
        <option value="岩手県">岩手県</option>
        <option value="宮城県">宮城県</option>
        <option value="秋田県">秋田県</option>
        <option value="山形県">山形県</option>
        <option value="福島県">福島県</option>
        <option value="茨城県">茨城県</option>
        <option value="栃木県">栃木県</option>
        <option value="群馬県">群馬県</option>
        <option value="埼玉県">埼玉県</option>
        <option value="千葉県">千葉県</option>
        <option value="東京都">東京都</option>
        <option value="神奈川県">神奈川県</option>
        <option value="新潟県">新潟県</option>
        <option value="富山県">富山県</option>
        <option value="石川県">石川県</option>
        <option value="福井県">福井県</option>
        <option value="山梨県">山梨県</option>
        <option value="長野県">長野県</option>
        <option value="岐阜県">岐阜県</option>
        <option value="静岡県">静岡県</option>
        <option value="愛知県">愛知県</option>
        <option value="三重県">三重県</option>
        <option value="滋賀県">滋賀県</option>
        <option value="京都府">京都府</option>
        <option value="大阪府">大阪府</option>
        <option value="兵庫県">兵庫県</option>
        <option value="奈良県">奈良県</option>
        <option value="和歌山県">和歌山県</option>
        <option value="鳥取県">鳥取県</option>
        <option value="島根県">島根県</option>
        <option value="岡山県">岡山県</option>
        <option value="広島県">広島県</option>
        <option value="山口県">山口県</option>
        <option value="徳島県">徳島県</option>
        <option value="香川県">香川県</option>
        <option value="愛媛県">愛媛県</option>
        <option value="高知県">高知県</option>
        <option value="福岡県">福岡県</option>
        <option value="佐賀県">佐賀県</option>
        <option value="長崎県">長崎県</option>
        <option value="熊本県">熊本県</option>
        <option value="大分県">大分県</option>
        <option value="宮崎県">宮崎県</option>
        <option value="鹿児島県">鹿児島県</option>
        <option value="沖縄県">沖縄県</option>
      </select>
    </div>

    <div class="form-group">
      <label>電話番号</label>
      <input id="phone" name="phone" maxlength="40" type="text"
             placeholder="電話番号をハイフンなし、半角でご記入ください">
    </div>

    <div class="form-group">
      <label>メールアドレス</label>
      <input id="email" name="email" maxlength="80" type="email"
             placeholder="メールアドレスを半角でご記入ください">
    </div>

    <div class="form-group">
      <label>お問い合わせ内容</label>
      <textarea id="00NH300000AJdOl" name="00NH300000AJdOl" rows="5"
                placeholder="お問い合わせ内容をご記入ください"></textarea>
    </div>

    <div class="button-area">
      <button type="submit">送信する</button>
    </div>

  </form>
</div>

</body>
</html>
