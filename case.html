<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>お問い合わせフォーム（Web-to-ケース）</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page-header">
  <h1>お問い合わせフォーム</h1>
  <p class="page-description">
    ※本ページは Salesforce Web-to-ケース機能のデモ用フォームです。送信された情報はテスト環境に登録されます。
  </p>
</div>

<div class="wrapper">

<form action="https://computing-business-2879--dev01.sandbox.my.salesforce.com/servlet/servlet.WebToCase?encoding=UTF-8&orgId=00DH30000008kpW"
      method="POST">

<input type="hidden" name="orgid" value="00DH30000008kpW">
<input type="hidden" name="retURL" value="http://">

<!-- お問い合わせ -->
<div class="form-group">
  <label>お問い合わせ</label>
  <select id="00NH300000AJi7L" name="00NH300000AJi7L">
    <option value="">選択してください</option>
    <option value="総合">総合</option>
    <option value="IR">IR</option>
    <option value="医薬品ネットワーク">医薬品ネットワーク</option>
    <option value="採用について">採用について</option>
  </select>
</div>

<!-- お問い合わせ内容 -->
<div class="form-group-textarea">
  <label>お問い合わせ内容</label>
  <textarea id="00NH300000AJdUI" name="00NH300000AJdUI"
            rows="10"
            placeholder="お問い合わせ内容を入力ください"></textarea>
</div>

<!-- お名前 -->
<div class="form-group">
  <label>お名前</label>
  <input id="00NH300000AJdUt" name="00NH300000AJdUt"
         placeholder="例) 山田 太郎">
</div>

<!-- フリガナ -->
<div class="form-group">
  <label>フリガナ</label>
  <div style="flex:1;">
    <input id="00NH300000AJdUs" name="00NH300000AJdUs"
           placeholder="例) ヤマダ タロウ">
    <div class="sub-guide">※全角</div>
  </div>
</div>

<!-- 会社名 -->
<div class="form-group">
  <label>会社名</label>
  <input id="company" name="company"
         placeholder="例) 株式会社メディカルシステムネットワーク">
</div>

<!-- 所属部署名/役職名 -->
<div class="form-group">
  <label>所属部署名/役職名</label>
  <input id="00NH300000AJi7Q" name="00NH300000AJi7Q"
         placeholder="例) 〇〇部□□課">
</div>

<!-- 郵便番号 -->
<div class="form-group">
  <label>郵便番号</label>
  <div style="display:flex; gap:10px; flex:1;">
    <div style="flex:1;">
      <input id="00NH300000AJi7a" name="00NH300000AJi7a"
             placeholder="例) 060">
    </div>
    <div style="flex:1;">
      <input id="00NH300000AJi7f" name="00NH300000AJi7f"
             placeholder="例) 0010">
    </div>
  </div>
</div>
<div class="sub-guide-wrapper">
  <div class="sub-guide">※半角数字</div>
</div>

<!-- 都道府県 -->
<div class="form-group">
  <label>都道府県</label>
  <select id="00NH300000AJdUw" name="00NH300000AJdUw">
    <option value="">選択してください</option>
    <!-- 既存の都道府県リストをそのまま貼り付けてください -->
  </select>
</div>
<div class="sub-guide-wrapper">
  <div class="sub-guide">
    ※お問い合わせ項目にて医薬品ネットワーク、または採用についてを選択される方は都道府県をご入力下さい。
  </div>
</div>

<!-- ご住所 -->
<div class="form-group">
  <label>ご住所</label>
  <input id="00NH300000AJi7V" name="00NH300000AJi7V"
         placeholder="例) 札幌市中央区北10条西24丁目3番地AKKビル">
</div>

<!-- 電話番号 -->
<div class="form-group">
  <label>電話番号</label>
  <div style="flex:1;">
    <input id="phone" name="phone"
           placeholder="例) 0116121069">
    <div class="sub-guide">※半角数字</div>
  </div>
</div>

<!-- FAX番号 -->
<div class="form-group">
  <label>FAX番号</label>
  <div style="flex:1;">
    <input id="00NH300000AJi7k" name="00NH300000AJi7k"
           placeholder="例) 0116121068">
    <div class="sub-guide">※半角数字</div>
  </div>
</div>

<!-- E-mail -->
<div class="form-group">
  <label>E-mail</label>
  <div style="flex:1;">
    <input id="email" name="email"
           placeholder="例) example@msnw.co.jp">
    <div class="sub-guide">※半角英数字</div>
  </div>
</div>

<div class="button-area">
  <button type="submit">送信する</button>
</div>

</form>
</div>

</body>
</html>
