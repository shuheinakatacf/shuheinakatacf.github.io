<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>お問い合わせフォーム（Web-to-ケース）</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page-header">
  <h1>お問い合わせフォーム</h1>
  <p class="page-description">
    ※本ページは Salesforce Web-to-ケース機能のデモ用フォームです。送信された情報はテスト環境に登録されます。
  </p>
</div>

<div class="wrapper">

<form action="https://computing-business-2879--dev01.sandbox.my.salesforce.com/servlet/servlet.WebToCase?encoding=UTF-8&orgId=00DH30000008kpW"
      method="POST">

<input type="hidden" name="orgid" value="00DH30000008kpW">
<input type="hidden" name="retURL" value="http://">

<!-- お問い合わせ -->
<div class="form-group">
  <label>お問い合わせ</label>
  <select id="00NH300000AJi7L" name="00NH300000AJi7L">
    <option value="">選択してください</option>
    <option value="総合">総合</option>
    <option value="IR">IR</option>
    <option value="医薬品ネットワーク">医薬品ネットワーク</option>
    <option value="採用について">採用について</option>
  </select>
</div>

<!-- お問い合わせ内容（横並びに変更） -->
<div class="form-group">
  <label>お問い合わせ内容</label>
  <textarea id="00NH300000AJdUI" name="00NH300000AJdUI"
            rows="10"
            placeholder="お問い合わせ内容を入力ください"></textarea>
</div>

<!-- お名前 -->
<div class="form-group">
  <label>お名前</label>
  <input id="00NH300000AJdUt" name="00NH300000AJdUt"
         placeholder="例) 山田 太郎">
</div>

<!-- フリガナ -->
<div class="form-group">
  <label>フリガナ</label>
  <div style="flex:1;">
    <input id="00NH300000AJdUs" name="00NH300000AJdUs"
           placeholder="例) ヤマダ タロウ">
    <div class="sub-guide">※全角</div>
  </div>
</div>

<!-- 会社名 -->
<div class="form-group">
  <label>会社名</label>
  <input id="company" name="company"
         placeholder="例) 株式会社メディカルシステムネットワーク">
</div>

<!-- 所属部署名/役職名 -->
<div class="form-group">
  <label>所属部署名/役職名</label>
  <input id="00NH300000AJi7Q" name="00NH300000AJi7Q"
         placeholder="例) 〇〇部□□課">
</div>

<!-- 郵便番号 -->
<div class="form-group">
  <label>郵便番号</label>
  <div class="input-wrapper">
    <div class="postal-group">
      <input id="00NH300000AJi7a" name="00NH300000AJi7a"
             placeholder="例) 060">
      <div class="postal-separator">ー</div>
      <input id="00NH300000AJi7f" name="00NH300000AJi7f"
             placeholder="例) 0010">
    </div>
    <div class="sub-guide">※半角数字</div>
  </div>
</div>

<!-- 都道府県 -->
<div class="form-group">
  <label>都道府県</label>
  <div class="input-wrapper">
    <select id="00NH300000AJdUw" name="00NH300000AJdUw">
      <option value="">選択してください</option>
        <option value="北海道">北海道</option>
        <option value="青森県">青森県</option>
        <option value="岩手県">岩手県</option>
        <option value="宮城県">宮城県</option>
        <option value="秋田県">秋田県</option>
        <option value="山形県">山形県</option>
        <option value="福島県">福島県</option>
        <option value="茨城県">茨城県</option>
        <option value="栃木県">栃木県</option>
        <option value="群馬県">群馬県</option>
        <option value="埼玉県">埼玉県</option>
        <option value="千葉県">千葉県</option>
        <option value="東京都">東京都</option>
        <option value="神奈川県">神奈川県</option>
        <option value="新潟県">新潟県</option>
        <option value="富山県">富山県</option>
        <option value="石川県">石川県</option>
        <option value="福井県">福井県</option>
        <option value="山梨県">山梨県</option>
        <option value="長野県">長野県</option>
        <option value="岐阜県">岐阜県</option>
        <option value="静岡県">静岡県</option>
        <option value="愛知県">愛知県</option>
        <option value="三重県">三重県</option>
        <option value="滋賀県">滋賀県</option>
        <option value="京都府">京都府</option>
        <option value="大阪府">大阪府</option>
        <option value="兵庫県">兵庫県</option>
        <option value="奈良県">奈良県</option>
        <option value="和歌山県">和歌山県</option>
        <option value="鳥取県">鳥取県</option>
        <option value="島根県">島根県</option>
        <option value="岡山県">岡山県</option>
        <option value="広島県">広島県</option>
        <option value="山口県">山口県</option>
        <option value="徳島県">徳島県</option>
        <option value="香川県">香川県</option>
        <option value="愛媛県">愛媛県</option>
        <option value="高知県">高知県</option>
        <option value="福岡県">福岡県</option>
        <option value="佐賀県">佐賀県</option>
        <option value="長崎県">長崎県</option>
        <option value="熊本県">熊本県</option>
        <option value="大分県">大分県</option>
        <option value="宮崎県">宮崎県</option>
        <option value="鹿児島県">鹿児島県</option>
        <option value="沖縄県">沖縄県</option>
    </select>
    <div class="sub-guide small-guide">
      ※医薬品ネットワーク、または採用についてを選択された方は都道府県をご入力下さい。
    </div>
  </div>
</div>

<!-- ご住所 -->
<div class="form-group">
  <label>ご住所</label>
  <input id="00NH300000AJi7V" name="00NH300000AJi7V"
         placeholder="例) 札幌市中央区北10条西24丁目3番地AKKビル">
</div>

<!-- 電話番号 -->
<div class="form-group">
  <label>電話番号</label>
  <div style="flex:1;">
    <input id="phone" name="phone"
           placeholder="例) 0116121069">
    <div class="sub-guide">※半角数字</div>
  </div>
</div>

<!-- FAX番号 -->
<div class="form-group">
  <label>FAX番号</label>
  <div style="flex:1;">
    <input id="00NH300000AJi7k" name="00NH300000AJi7k"
           placeholder="例) 0116121068">
    <div class="sub-guide">※半角数字</div>
  </div>
</div>

<!-- E-mail -->
<div class="form-group">
  <label>E-mail</label>
  <div style="flex:1;">
    <input id="email" name="email"
           placeholder="例) example@msnw.co.jp">
    <div class="sub-guide">※半角英数字</div>
  </div>
</div>

<div class="button-area">
  <button type="submit">送信する</button>
</div>

</form>
</div>

</body>
</html>
