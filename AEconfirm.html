<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>入力内容の確認</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="style_confirm.css">
</head>
<body>

<!-- タイトル帯 -->
<div class="page-header">
  <h1>入力内容の確認</h1>
  <p class="page-description">
    以下の内容でよろしければ「送信する」ボタンを押してください。
  </p>
</div>

<div class="wrapper">

  <!-- 確認テーブル -->
  <table class="confirm-table">
    <tr>
      <th>お名前</th>
      <td id="c_name"></td>
    </tr>
    <tr>
      <th>フリガナ</th>
      <td id="c_furigana"></td>
    </tr>
    <tr>
      <th>会社名</th>
      <td id="c_company"></td>
    </tr>
    <tr>
      <th>薬局名</th>
      <td id="c_pharmacy"></td>
    </tr>
    <tr>
      <th>役職名</th>
      <td id="c_position"></td>
    </tr>
    <tr>
      <th>都道府県</th>
      <td id="c_pref"></td>
    </tr>
    <tr>
      <th>電話番号</th>
      <td id="c_tel"></td>
    </tr>
    <tr>
      <th>メールアドレス</th>
      <td id="c_email"></td>
    </tr>
    <tr>
      <th>お問い合わせ内容</th>
      <td id="c_message" class="inquiry-cell"></td>
    </tr>
  </table>

  <!-- AccountEngagementへ送信する隠しフォーム -->
  <form id="aeForm"
        action="http://go.pardot.com/l/1123063/2026-04-21/24xmn41"
        method="post">
    <input type="hidden" id="sf_your_name"     name="your_name">
    <input type="hidden" id="sf_your_kana"     name="your_kana">
    <input type="hidden" id="sf_company"       name="company">
    <input type="hidden" id="sf_pharmacy_name" name="pharmacy_name">
    <input type="hidden" id="sf_position"      name="position">
    <input type="hidden" id="sf_pref"          name="pref">
    <input type="hidden" id="sf_tel"           name="tel">
    <input type="hidden" id="sf_email"         name="email">
    <input type="hidden" id="sf_message"       name="message">
  </form>

  <div class="button-area confirm-buttons">
    <button type="button" class="btn-submit" onclick="submitForm()">送信する</button>
    <button type="button" class="btn-back"   onclick="goBack()">入力内容を修正する</button>
  </div>

</div>

<script>
window.addEventListener('DOMContentLoaded', function() {
  const saved = localStorage.getItem('formData');
  if (!saved) {
    window.location.href = 'AEtest.html';
    return;
  }
  const data = JSON.parse(saved);

  // 確認テーブルに表示
  document.getElementById('c_name').textContent     = data.your_name     || '';
  document.getElementById('c_furigana').textContent = data.your_kana     || '';
  document.getElementById('c_company').textContent  = data.company       || '';
  document.getElementById('c_pharmacy').textContent = data.pharmacy_name || '';
  document.getElementById('c_position').textContent = data.position      || '';
  document.getElementById('c_pref').textContent     = data.pref          || '';
  document.getElementById('c_tel').textContent      = data.tel           || '';
  document.getElementById('c_email').textContent    = data.email         || '';
  document.getElementById('c_message').textContent  = data.message       || '';

  // 隠しフォームにセット
  document.getElementById('sf_your_name').value     = data.your_name     || '';
  document.getElementById('sf_your_kana').value     = data.your_kana     || '';
  document.getElementById('sf_company').value       = data.company       || '';
  document.getElementById('sf_pharmacy_name').value = data.pharmacy_name || '';
  document.getElementById('sf_position').value      = data.position      || '';
  document.getElementById('sf_pref').value          = data.pref          || '';
  document.getElementById('sf_tel').value           = data.tel           || '';
  document.getElementById('sf_email').value         = data.email         || '';
  document.getElementById('sf_message').value       = data.message       || '';
});

function submitForm() {
  localStorage.removeItem('formData');
  document.getElementById('aeForm').submit();
}

function goBack() {
  window.location.href = 'AEtest.html?back=true';
}
</script>

</body>
</html>
