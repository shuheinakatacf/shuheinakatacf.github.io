<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>お問い合わせフォーム</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrapper">
  <h1>お問い合わせ</h1>
  <p class="lead">
    以下のフォームに必要事項をご入力のうえ、送信してください。
  </p>

  <form action="https://test.salesforce.com/servlet/servlet.WebToLead?encoding=UTF-8&orgId=00DH30000008kpW"
        method="POST">

    <input type="hidden" name="oid" value="00DH30000008kpW">
    <input type="hidden" name="retURL" value="https://example.com/thanks.html">

    <div class="form-group">
      <label>姓<span class="required">必須</span></label>
      <input id="last_name" name="last_name" maxlength="80" type="text" required>
    </div>

    <div class="form-group">
      <label>フリガナ</label>
      <input id="00NH300000AJdOn" name="00NH300000AJdOn" maxlength="255" type="text">
    </div>

    <div class="form-group">
      <label>会社名<span class="required">必須</span></label>
      <input id="company" name="company" maxlength="40" type="text" required>
    </div>

    <div class="form-group">
      <label>薬局名</label>
      <input id="00NH300000AJdOt" name="00NH300000AJdOt" maxlength="255" type="text">
    </div>

    <div class="form-group">
      <label>役職</label>
      <input id="title" name="title" maxlength="40" type="text">
    </div>

    <div class="form-group">
      <label>都道府県</label>
      <input id="state" name="state" maxlength="20" type="text">
    </div>

    <div class="form-group">
      <label>電話</label>
      <input id="phone" name="phone" maxlength="40" type="text">
    </div>

    <div class="form-group">
      <label>メール<span class="required">必須</span></label>
      <input id="email" name="email" maxlength="80" type="email" required>
    </div>

    <div class="form-group">
      <label>お問い合わせ内容</label>
      <textarea id="00NH300000AJdOl" name="00NH300000AJdOl" rows="5"></textarea>
    </div>

    <div class="button-area">
      <button type="submit">送信する</button>
    </div>

  </form>
</div>

</body>
</html>
